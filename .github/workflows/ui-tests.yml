name: Playwright UI tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Show Python version
        run: python --version
      - name: Install dependencies and browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start local application
        run: |
          echo "Checking project files..."
          pwd
          ls -la
          test -f delivery.html

          echo "Starting HTTP server..."
          python -u -m http.server 8000 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > server.log 2>&1 &
          echo $! > server.pid

          echo "Waiting for server..."

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/delivery.html > /dev/null; then
              echo "Server started successfully!"
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Server process stopped!"
              cat server.log
              exit 1
            fi

            sleep 1
          done

          echo "Server did not respond!"
          cat server.log
          exit 1
      - name: Run UI tests
        run: |
          python -m pytest -v --browser chromium \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output test-results --junitxml=report.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            report.xml
            test-results/
            server.log
          if-no-files-found: warn
