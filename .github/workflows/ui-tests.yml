
name: UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright playwright
          playwright install --with-deps chromium

      - name: Start local application
        run: |
          nohup python -u -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Server is ready"
              break
            fi
            sleep 2
          done
          curl -f http://127.0.0.1:8000/index.html

      - name: Run UI tests
        run: |
          python -m pytest -v --browser chromium \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output test-results \
            --junitxml=report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            report.xml
            test-results/
            server.log
          if-no-files-found: ignore
